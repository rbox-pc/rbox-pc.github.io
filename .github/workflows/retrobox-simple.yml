name: RetroBox simple - RetroArch engine
on:
  push:
    branches: [retrobox-retroarch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Dependencies and analysis
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test launch configuration
        working-directory: app
        run: flutter test test/retroarch_launch_test.dart test/android_home_test.dart
      - name: Upload rendered UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroBox-Android-UI-Previews
          path: app/build/ui-preview/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build frontend
        working-directory: app
        run: flutter build windows --release
      - name: Download reference engine and five test cores
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --retry 3 https://buildbot.libretro.com/stable/1.22.2/windows/x86_64/RetroArch.7z -o engine.7z
          if ($LASTEXITCODE) { throw 'Engine download failed' }
          curl.exe -fL --retry 3 https://buildbot.libretro.com/stable/1.22.2/windows/x86_64/RetroArch_cores.7z -o cores.7z
          if ($LASTEXITCODE) { throw 'Core download failed' }
          7z x engine.7z -oengine-full -y | Out-Null
          if ($LASTEXITCODE) { throw 'Engine extraction failed' }
          $exe = @(Get-ChildItem engine-full -Filter retroarch.exe -Recurse)
          if ($exe.Count -ne 1) { throw 'Expected one RetroArch executable' }
          $source = $exe[0].Directory.FullName
          $release = 'app/build/windows/x64/runner/Release'
          $engine = "$release/engine"
          New-Item -ItemType Directory -Force "$engine/cores" | Out-Null
          Copy-Item "$source/retroarch.exe" $engine
          # Keep runtime DLLs; discard themes, databases, shaders, overlays and debug tools.
          Copy-Item "$source/*.dll" $engine
          Get-ChildItem $source -File | Where-Object { $_.Name -match 'COPYING|LICENSE' } | Copy-Item -Destination $engine
          $cores = @('stella_libretro.dll','fceumm_libretro.dll','bsnes_libretro.dll','blastem_libretro.dll','mame_libretro.dll')
          foreach ($core in $cores) {
            7z e cores.7z "-o$engine/cores" $core -r -y | Out-Null
            if ($LASTEXITCODE -or !(Test-Path "$engine/cores/$core")) { throw "Missing core $core" }
          }
          Copy-Item app/CORE-LICENSE-INVENTORY.txt "$release/CORE-LICENSE-INVENTORY.txt"
          curl.exe -fL --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip -o sdl.zip
          if ($LASTEXITCODE) { throw 'SDL2 download failed' }
          7z e sdl.zip "-o$release" SDL2.dll -r -y | Out-Null
          if (!(Test-Path "$release/SDL2.dll")) { throw 'Missing frontend SDL2 runtime' }
          curl.exe -fL --retry 3 https://raw.githubusercontent.com/libsdl-org/SDL/release-2.32.10/LICENSE.txt -o "$release/SDL2-LICENSE.txt"
          if ($LASTEXITCODE) { throw 'SDL2 license download failed' }
          Copy-Item app/RETROARCH_INTEGRATION.md "$release/LEEME-PRUEBA.md"
          Get-ChildItem $engine -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File "$release/ENGINE-HASHES.txt"
          $bytes = (Get-ChildItem $release -Recurse -File | Measure-Object Length -Sum).Sum
          "Uncompressed bytes: $bytes" | Tee-Object -FilePath "$release/PACKAGE-SIZE.txt"
      - uses: actions/checkout@v4
        with:
          repository: libretro/retroarch-joypad-autoconfig
          path: controller-profiles
      - name: Include controller profiles
        shell: pwsh
        run: |
          $destination = 'app/build/windows/x64/runner/Release/engine/autoconfig'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($driver in @('sdl2','xinput','dinput')) {
            Copy-Item "controller-profiles/$driver" $destination -Recurse
          }
          if (!(Test-Path "$destination/sdl2/Nintendo Switch Pro Controller.cfg")) { throw 'Switch profile missing' }
      - name: Validate native cores
        shell: pwsh
        run: |
          @'
          import ctypes, pathlib, json
          root = pathlib.Path("app/build/windows/x64/runner/Release/engine")
          class Info(ctypes.Structure):
              _fields_ = [("name", ctypes.c_char_p), ("version", ctypes.c_char_p), ("extensions", ctypes.c_char_p), ("fullpath", ctypes.c_bool), ("block_extract", ctypes.c_bool)]
          identities = {}
          for path in sorted((root / "cores").glob("*.dll")):
              core = ctypes.CDLL(str(path.resolve()))
              info = Info()
              core.retro_get_system_info.argtypes = [ctypes.POINTER(Info)]
              core.retro_get_system_info(ctypes.byref(info))
              assert info.name and info.version, path
              identities[path.name] = info.name.decode()
              print(path.name, info.name.decode(), info.version.decode())
          (root / "CORE_IDENTITIES.json").write_text(json.dumps(identities), encoding="utf-8")
          '@ | Set-Content validate.py
          python validate.py
          if ($LASTEXITCODE) { throw 'Native core validation failed' }
      - name: Report complete package size
        shell: pwsh
        run: |
          $release = 'app/build/windows/x64/runner/Release'
          $bytes = (Get-ChildItem $release -Recurse -File | Measure-Object Length -Sum).Sum
          "Uncompressed bytes: $bytes" | Tee-Object -FilePath "$release/PACKAGE-SIZE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: RetroBox-Simple-Windows-PRUEBA-NO-COMERCIAL
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
